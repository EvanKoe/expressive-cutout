name: Apply audit fixes

on:
  push:
    branches:
      - 'fix/comprehensive-audit'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply audit fixes') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/audit-code.diff.gz.b64 | gzip -d > /tmp/audit-code.diff
          git apply --check /tmp/audit-code.diff
          git apply /tmp/audit-code.diff

      - name: Commit source fixes and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/audit-code.diff.gz.b64 .github/workflows/apply-audit-fixes.yml
          git add -A
          git commit -m "Apply audit fixes"
          git push origin HEAD:fix/comprehensive-audit
