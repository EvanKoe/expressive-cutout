name: Apply double-pill fix

on:
  push:
    branches:
      - fix/double-pill

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch duplicate satellite identity handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/vikram/expressiveisland/overlay/IslandOverlayController.kt')
          text = path.read_text()

          old_helper = '''    /**
     * Whether both events represent the same live tile.
     * Live tiles are singletons, so a new signal for the same tile should
     * replace the existing pill instead of being parked beside itself.
     */
    private fun isSameTile(a: IslandEvent, b: IslandEvent): Boolean =
        (a.media != null && b.media != null) ||
                (a.timer != null && b.timer != null) ||
                (a.call != null && b.call != null) ||
                (a.assistant != null && b.assistant != null)
'''

          new_helper = '''    /**
     * Whether two events represent the same logical live tile.
     * Live tiles are singletons, so a fresh signal must update the existing tile rather than
     * creating a second visual slot with the same activity.
     */
    private fun isSameTile(a: IslandEvent, b: IslandEvent): Boolean =
        (a.media != null && b.media != null) ||
                (a.timer != null && b.timer != null) ||
                (a.call != null && b.call != null) ||
                (a.assistant != null && b.assistant != null)

    /**
     * Whether the incoming event is already parked in the satellite slot.
     * Notification keys are the authoritative identity for normal notifications. For live tiles,
     * [isSameTile] deliberately ignores the generated event id because every refresh gets a new id.
     */
    private fun isSameEvent(a: IslandEvent, b: IslandEvent): Boolean =
        (a.notificationKey != null && a.notificationKey == b.notificationKey) ||
                isSameTile(a, b) ||
                a.id == b.id
'''

          old_demote = '''    private fun demoteToSatellite(
        displaced: IslandEvent?,
        incoming: IslandEvent,
        deadlineMs: Long?,
    ) {
        // The same live tile must never occupy both the main pill and satellite.
        // A fresh event ID does not mean it is a different tile.
        if (displaced != null && isSameTile(displaced, incoming)) {
            return
        }

        if (displaced == null || !satelliteAllowed(displaced, incoming)) {
            clearSatellite()
            return
        }

        parkInSatellite(displaced, deadlineMs)
    }
'''

          new_demote = '''    private fun demoteToSatellite(
        displaced: IslandEvent?,
        incoming: IslandEvent,
        deadlineMs: Long?,
    ) {
        // If this exact event is already in the satellite slot, remove the stale satellite first.
        // Otherwise a notification update can leave the same notification rendered simultaneously
        // as the new main pill and the old satellite bubble.
        val parked = satelliteEvent.value
        if (parked != null && isSameEvent(parked, incoming)) {
            clearSatellite()
        }

        // The same live tile must never occupy both the main pill and satellite.
        // A fresh event ID does not mean it is a different tile.
        if (displaced != null && isSameTile(displaced, incoming)) {
            return
        }

        if (displaced == null || !satelliteAllowed(displaced, incoming)) {
            clearSatellite()
            return
        }

        parkInSatellite(displaced, deadlineMs)
    }
'''

          if old_helper not in text:
              raise SystemExit('helper pattern not found')
          if old_demote not in text:
              raise SystemExit('demote pattern not found')

          text = text.replace(old_helper, new_helper, 1)
          text = text.replace(old_demote, new_demote, 1)
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/vikram/expressiveisland/overlay/IslandOverlayController.kt
          git commit -m "fix: prevent duplicate satellite event rendering"
          git push

      - name: Remove temporary patch workflow
        run: |
          git rm .github/workflows/apply-double-pill-fix.yml
          git commit -m "chore: remove temporary double-pill patch workflow"
          git push
